summary: >-
  MetricStream publishes NO first-party client SDK for its Business REST APIs in any
  public package registry. The published API reference pages render swagger-codegen
  usage samples for Java, Groovy, Obj-C, JavaScript, C#, PHP, Perl and Python — but
  those samples import the generic `io.swagger.client` / `swagger_client` /
  `metricstream_business_api` codegen output, and none of those artifacts is published
  to Maven Central, PyPI or npm. A developer following the documentation must generate
  the client themselves, and cannot do so from a published spec because MetricStream
  does not publish one (see openapi/ absence recorded in conventions/).
  The packages below ARE first-party MetricStream code (group id `com.metricstream*`,
  MetricStream GitHub org) but they are internal engineering libraries, NOT API client
  SDKs — so no `SDKs` pointer is emitted in apis.yml. Emitting one would credit
  MetricStream with an API client library it does not ship.
