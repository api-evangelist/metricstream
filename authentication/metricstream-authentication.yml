oauth:
  declared: false
  note: >-
    No OAuth 2.0 or OpenID Connect surface is documented or discoverable, so no scopes/ artifact is
    written — this is a key/credential API with no published scope vocabulary, and forcing an empty
    scopes file would misrepresent it.
gap: >-
  This is the highest-value, lowest-cost fix on MetricStream's public API surface. A single page
  naming the scheme (header name, credential type, how to obtain it, token lifetime) would let a
  developer or an agent get from the published 204-operation reference to a first successful call.
  Today the reference is complete enough to plan an integration and stops one step short of making one.
