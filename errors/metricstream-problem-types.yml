rfc9457: false
note: 'MetricStream does NOT use RFC 9457 application/problem+json. Its Business REST APIs declare a plain
  HTTP status vocabulary, identically on every one of the 204 published operations: 200, 400, 401, 403,
  404 and 422. The provider''s own API Overview pages describe the practice as "Usage of Standardized
  Status and Error codes for easier identification, categorization, and debugging" and "A common validation
  framework for simpler and descriptive validations", but the PUBLIC documentation does not publish the
  error BODY shape, an error-code registry, or remediation guidance — only the status line and a one-line
  description. That is the gap: an agent can tell that a call failed and roughly why, but cannot parse
  a machine-readable error identifier out of the response, because none is documented.'
