domain_standard:
  market: Governance, Risk and Compliance (GRC) / integrated risk management
  declared_in_contract: false
  candidates_probed:
  - standard: OSCAL (NIST Open Security Controls Assessment Language)
    found: false
    note: >-
      OSCAL is the obvious machine-readable control/catalog standard for this market. No OSCAL
      catalog, profile, component-definition or assessment-results shape appears in the 34 published
      reference pages, and the GRC Foundation model uses MetricStream's own Control / Requirement /
      Standard / Regulatory Body entities instead.
  - standard: OCSF (Open Cybersecurity Schema Framework)
    found: false
    note: >-
      MetricStream has BLOGGED about OCSF and AWS Security Lake
      (https://www.metricstream.com/blog/aws-security-lake-ocsf-cyber-risk-perspective.html), which is
      a prose claim, not a contract declaration. No OCSF event class appears in the published API surface.
  - standard: UCF (Unified Compliance Framework) Common Controls Hub
    found: partner-listed
    note: >-
      MetricStream is listed as a Unified Compliance partner
      (https://www.unifiedcompliance.com/partner/metricstream/), and its GRC Foundation model carries
      Standard / Requirement / Framework-Reference entities of the shape UCF mappings use — but the
      published contract declares no UCF identifier scheme, so this is recorded as a lead, not a conformance.
  - standard: XBRL / ISO 20022 / X12
    found: false
  conforms: false
  note: >-
    REWARD-ONLY dimension: MetricStream is NOT penalised here. The finding is that the GRC market's
    machine-readable control standards (OSCAL above all) are absent from a contract that models
    Controls, Requirements, Standards and Regulatory Bodies as first-class entities — which is the
    single clearest standards opportunity on this surface.
