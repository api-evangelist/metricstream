source: Derived from the 34 published MetricStream Business API reference pages under https://assets.metricstream.com/pdf/Developer-Portal/
  (read 2026-08-25). MetricStream publishes no machine-readable spec, so entity names, resource paths
  and operation counts are read from the reference pages; relationships are read from the inline definition
  names those pages carry.
summary: '34 addressable GRC entities across 8 API families, each exposing the SAME six-operation surface
  (get, create, patch on the singular resource; collections, creations, updates on the bulk resource)
  for 204 documented operations. Every entity is identified by an `ObjectID` passed as the path parameter
  `id` (declared type String). The reference pages carry 1,221 distinct `#/definitions/` schema names
  — an average of ~36 sub-schemas per entity, because MetricStream models each entity as a header object
  plus named form SECTIONS (Details, OwnershipAndSecurity, AdditionalDetails, Comments) and GROUPFIELDS
  (Dates, Approvers, Hierarchy, Validity, Classification, Attachments, Relationships). That section/groupfield
  shape is itself the platform''s data model: an App Studio form maps 1:1 onto the JSON body.'
