aid: metricstream
name: MetricStream
description: MetricStream is a San Jose, California based enterprise software company
  and a market leader in integrated Governance, Risk, and Compliance (GRC) management,
  serving large regulated organizations across banking and financial services, insurance,
  healthcare, life sciences, energy, utilities, telecom, technology and manufacturing.
  Its AI-first Connected GRC platform unifies enterprise and operational risk, regulatory
  and corporate compliance, policy and document management, internal audit and SOX,
  IT and cyber risk, third-party and vendor risk, operational resilience and business
  continuity, ESG, and case and incident management on one data core. MetricStream
  publishes a public API developer portal describing its Business REST APIs — a family
  of OpenAPI-derived REST modules covering GRC Foundation objects, Issues, Loss Event
  Management, Metrics, Risk Assessments, Regulatory Engagements, Surveys and Self Assessment
  & Testing — that customers, partners and internal developers use to move GRC data
  in and out of a MetricStream instance over HTTPS.
