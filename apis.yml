apis:
- aid: metricstream-grc-foundation
  name: MetricStream GRC Foundation APIs
  description: Business REST APIs over the GRC Foundation object model — Area of Compliance,
    Asset, Asset Class, Control, Evidence, Exception, Financial Accounts, Function,
    Framework/Model Reference, Objectives, Process, Product, Question & Procedure,
    Reference, Regulatory Body, Requirement, Risk and Standard. Each entity exposes
    the same six-operation surface (single read, single create, single patch, plus
    bulk collections read, bulk create and bulk patch), for 108 documented operations.
  humanURL: https://assets.metricstream.com/pdf/Developer-Portal/GRCF_API/MsGrcGRC%20API%20Overview.html
