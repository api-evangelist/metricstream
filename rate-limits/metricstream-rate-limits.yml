summary: >-
  MetricStream publishes NO rate limits for its Business REST APIs. The module overview pages
  enumerate the cross-cutting conventions the platform DOES guarantee — pagination, sorting, error
  handling, validation, authorization — and rate limiting is conspicuously not among them. No
  RateLimit-* or X-RateLimit-* response header is documented anywhere, no Retry-After is mentioned,
  and 429 is not declared on any of the 204 published operations (the declared status set is
  200/400/401/403/404/422 on every single one). An agent therefore has no runtime signal for
  throttling and no documented backoff contract.
