security_advisory_practice: >-
  Historic CVE advisories (Apache Log4j CVE-2021-44228, Spring4Shell, the Okta/Lapsus$ incident) were
  published as Trust Center links rather than on a status service.
vulnerability_management_published: true
vulnerability_management_note: >-
  The Security Standards document publishes concrete remediation SLAs — monthly vulnerability
  assessments, critical vulnerabilities closed "as soon as possible without any undue delay" with a
  verification rescan, high severity within 30 days, medium/low prioritised by customer impact —
  and a 48-hour breach/incident notification commitment. That is a stronger published commitment
  than most vendors make, and it is the reason the vulnerability-disclosure gap below is notable.
