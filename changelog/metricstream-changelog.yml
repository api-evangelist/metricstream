summary: >-
  MetricStream has NO developer-facing API changelog or release-notes feed. Product releases are
  announced as marketing blog posts and press releases, named after rivers (Arno, Brazos, Colorado,
  Danube, Euphrates) with an "Update N" counter. Those posts do occasionally name API changes, so
  they are the only public record of API evolution — which is exactly what the API documentation
  itself warns about ("Owing to continuous releases and patches, APIs are constantly evolving...
  For the latest updates, contact MetricStream Support team").
scheme: named platform release + numbered update (e.g. "Euphrates-II Update 7"), announced monthly-ish
